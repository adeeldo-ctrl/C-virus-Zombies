name: Prototype browser validation

concurrency:
  group: c-virus-prototype-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/validate-prototype.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/validate-prototype.yml"

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install
      - name: Build production web bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: npm run test:browser
