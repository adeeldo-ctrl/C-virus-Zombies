name: Prototype browser validation

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/validate-prototype.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/validate-prototype.yml"

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser gameplay smoke test
        run: node web/smoke-test.cjs
