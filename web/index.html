<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>C virus Zombies — Browser Prototype</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-title">C VIRUS ZOMBIES <span>PROTOTYPE</span></div><button id="pause-button" type="button">PAUSE</button>
    <div class="health-wrap"><div id="health"></div></div><div class="stamina-wrap"><span>STAMINA</span><div class="stamina-track"><div id="stamina"></div></div></div>
    <div class="hud-meta"><div id="status">Collect supply crates and reach the green safe zone.</div><div class="supply-pill">SUPPLIES <b id="supplies">0</b><span>/4</span></div></div>
  </div>
  <div id="controls"><div id="stick"><div id="knob"></div></div><div id="look-help">Move • Drag right side to look</div><div id="action-buttons"><button id="sprint" type="button">RUN</button><button id="jump" type="button">JUMP</button><button id="drive" type="button">DRIVE</button></div></div>
  <div id="message">Collect supplies and reach the safe zone</div>
  <div id="end-overlay" hidden><div class="pause-card"><div id="end-title" class="pause-heading">MISSION COMPLETE</div><div id="end-text" class="pause-subtitle">Objective secured.</div><button id="retry-button" type="button">PLAY AGAIN</button></div></div>
  <div id="pause-overlay" hidden><div class="pause-card"><div class="pause-heading">GAME PAUSED</div><div class="pause-subtitle">Your progress is saved automatically.</div><button id="resume-button" type="button">RESUME GAME</button></div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
